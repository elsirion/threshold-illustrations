<text x="1204" y="235" font-size="20" fill="#576875" font-weight="bold" text-anchor="start">THRESHOLDS IN THIS MODEL</text>
<text x="1204" y="290" font-size="23" fill="#b84e34" font-weight="bold" text-anchor="start">Federation fund safety</text>
<text x="1204" y="326" font-size="23" fill="#1b2935" font-weight="normal" text-anchor="start">≈ ⅔ of keys compromised</text>
<text x="1204" y="359" font-size="19" fill="#576875" font-weight="normal" text-anchor="start">Unauthorized signing</text>
<line x1="1204" y1="387" x2="1598" y2="387" stroke="#dce3e8" stroke-width="1" stroke-dasharray=""/>
<text x="1204" y="428" font-size="23" fill="#326bb2" font-weight="bold" text-anchor="start">Federation liveness</text>
<text x="1204" y="464" font-size="23" fill="#1b2935" font-weight="normal" text-anchor="start">≈ ⅓ of nodes stalled</text>
<text x="1204" y="497" font-size="19" fill="#576875" font-weight="normal" text-anchor="start">Not enough nodes for a quorum</text>
<line x1="1204" y1="525" x2="1598" y2="525" stroke="#dce3e8" stroke-width="1" stroke-dasharray=""/>
<text x="1204" y="566" font-size="23" fill="#a96b08" font-weight="bold" text-anchor="start">Bitcoin reference</text>
<text x="1204" y="602" font-size="23" fill="#1b2935" font-weight="normal" text-anchor="start">&gt; ½ of hashpower controlled</text>
<text x="1204" y="635" font-size="19" fill="#576875" font-weight="normal" text-anchor="start">Majority control—not key theft</text>
<line x1="1204" y1="663" x2="1598" y2="663" stroke="#dce3e8" stroke-width="1" stroke-dasharray=""/>
<text x="1204" y="710" font-size="20" fill="#576875" font-weight="normal" text-anchor="start">Near-equal weight per codebase.</text>
<text x="1204" y="744" font-size="20" fill="#576875" font-weight="normal" text-anchor="start">3,000,001 units; exact thresholds.</text>
<text x="1204" y="778" font-size="20" fill="#576875" font-weight="normal" text-anchor="start">Total effort split equally.</text>
<rect x="72" y="852" width="1556" height="76" rx="14" fill="#e4f1ed"/>
<text x="101" y="901" font-size="30" fill="#075e50" font-weight="bold" text-anchor="start">The quorum and allocation matter—not just implementation count.</text>
<text x="72" y="964" font-size="20" fill="#576875" font-weight="normal" text-anchor="start">Toy probabilities, not estimates. Common-failure floor: 0.01%; shared-exposure correlation retained.</text>
<text x="72" y="995" font-size="20" fill="#576875" font-weight="normal" text-anchor="start">Bitcoin is a majority-hashpower reference, not a theft estimate. Liveness assumes stalled nodes; build costs excluded.</text>
